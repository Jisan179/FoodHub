<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1385" width="1100" height="1385" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="title">FoodHub order workflow</title>
<desc id="desc">How one order moves between the customer, the restaurant manager and the rider, with the order status after each step and the ways it can be cancelled or released.</desc>
<defs><marker id="a-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="a-b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="a-6d28d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker><marker id="a-1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker><marker id="a-be123c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker><marker id="a-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="a-15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="a-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker></defs>
<rect width="1100" height="1385" fill="#ffffff"/>
<text x="550" y="34" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">How an order works, from search to review</text>
<rect x="10" y="56" width="280" height="1149" fill="#fbfcfe" stroke="#cbd5e1"/>
<rect x="10" y="56" width="280" height="44" fill="#fff7ed" stroke="#cbd5e1"/>
<rect x="10" y="56" width="280" height="5" fill="#b45309"/>
<text x="150" y="86" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">Customer</text>
<rect x="290" y="56" width="280" height="1149" fill="#fbfcfe" stroke="#cbd5e1"/>
<rect x="290" y="56" width="280" height="44" fill="#f5f3ff" stroke="#cbd5e1"/>
<rect x="290" y="56" width="280" height="5" fill="#6d28d9"/>
<text x="430" y="86" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="middle">Restaurant Manager</text>
<rect x="570" y="56" width="280" height="1149" fill="#fbfcfe" stroke="#cbd5e1"/>
<rect x="570" y="56" width="280" height="44" fill="#eff6ff" stroke="#cbd5e1"/>
<rect x="570" y="56" width="280" height="5" fill="#1d4ed8"/>
<text x="710" y="86" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">Rider</text>
<rect x="850" y="56" width="240" height="1149" fill="#fbfcfe" stroke="#cbd5e1"/>
<rect x="850" y="56" width="240" height="44" fill="#f0fdfa" stroke="#cbd5e1"/>
<rect x="850" y="56" width="240" height="5" fill="#0f766e"/>
<text x="970" y="86" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">Order status</text>
<rect x="32" y="130" width="236" height="66" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
<text x="150" y="159.5" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Search and open a menu</text>
<text x="150" y="179.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Restaurant name, dish or category</text>
<circle cx="32" cy="130" r="13" fill="#b45309"/>
<text x="32" y="134.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<rect x="32" y="232" width="236" height="66" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
<text x="150" y="261.5" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Add dishes to the cart</text>
<text x="150" y="281.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">One restaurant per cart</text>
<circle cx="32" cy="232" r="13" fill="#b45309"/>
<text x="32" y="236.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<rect x="32" y="334" width="236" height="84" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
<text x="150" y="364" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Place the order</text>
<text x="150" y="384" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Address, phone, Cash on Delivery</text>
<text x="150" y="400.9" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">or simulated wallet</text>
<circle cx="32" cy="334" r="13" fill="#b45309"/>
<text x="32" y="338.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<path d="M150 196V230" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<path d="M150 298V332" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<rect x="320" y="440" width="500" height="62" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="570" y="467.5" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">FoodHub checks and saves the order</text>
<text x="570" y="487.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Prices and availability come from the database, in one transaction</text>
<path d="M150 418V471H318" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a-0f766e)"/>
<path d="M820 471H884" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a-0f766e)"/>
<rect x="886" y="456" width="168" height="30" rx="15" fill="#a16207"/>
<text x="970" y="476" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">Pending</text>
<rect x="312" y="540" width="236" height="66" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
<text x="430" y="569.5" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Accept the order</text>
<text x="430" y="589.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">or Reject it</text>
<circle cx="312" cy="540" r="13" fill="#6d28d9"/>
<text x="312" y="544.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<path d="M430 502V538" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<path d="M548 573H884" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a-6d28d9)"/>
<rect x="886" y="558" width="168" height="30" rx="15" fill="#6d28d9"/>
<text x="970" y="578" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">Preparing</text>
<rect x="592" y="628" width="236" height="84" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="710" y="658" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Accept the delivery</text>
<text x="710" y="678" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Any time while Pending, Preparing</text>
<text x="710" y="694.9" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">or Ready. Address shown now</text>
<circle cx="592" cy="628" r="13" fill="#1d4ed8"/>
<text x="592" y="632.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<path d="M570 502V520H710V626" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-1d4ed8)"/>
<rect x="312" y="738" width="236" height="66" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
<text x="430" y="767.5" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Mark ready</text>
<text x="430" y="787.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">The food is cooked</text>
<circle cx="312" cy="738" r="13" fill="#6d28d9"/>
<text x="312" y="742.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<path d="M430 606V736" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<path d="M548 771H884" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a-6d28d9)"/>
<rect x="886" y="756" width="168" height="30" rx="15" fill="#0369a1"/>
<text x="970" y="776" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">Ready for Delivery</text>
<rect x="592" y="838" width="236" height="66" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="710" y="867.5" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Confirm pickup</text>
<text x="710" y="887.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Only when the order is Ready</text>
<circle cx="592" cy="838" r="13" fill="#1d4ed8"/>
<text x="592" y="842.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<path d="M710 712V836" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<path d="M430 804V871H590" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<path d="M828 871H884" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a-1d4ed8)"/>
<rect x="886" y="856" width="168" height="30" rx="15" fill="#1d4ed8"/>
<text x="970" y="876" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">Out for Delivery</text>
<rect x="592" y="944" width="236" height="84" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="710" y="974" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Mark delivered</text>
<text x="710" y="994" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Payment becomes Paid. Rider earns</text>
<text x="710" y="1010.9" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">10% of the order total</text>
<circle cx="592" cy="944" r="13" fill="#1d4ed8"/>
<text x="592" y="948.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<path d="M710 904V942" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a-475569)"/>
<path d="M828 986H884" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-15803d)"/>
<rect x="886" y="971" width="168" height="30" rx="15" fill="#15803d"/>
<text x="970" y="991" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">Delivered</text>
<rect x="32" y="944" width="236" height="84" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
<text x="150" y="974" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Rate and review</text>
<text x="150" y="994" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Once for each delivered dish.</text>
<text x="150" y="1010.9" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Can edit or delete</text>
<circle cx="32" cy="944" r="13" fill="#b45309"/>
<text x="32" y="948.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">9</text>
<path d="M592 986H270" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-15803d)"/>
<text x="425" y="1070" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">Other paths</text>
<rect x="32" y="1088" width="236" height="96" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
<text x="150" y="1124" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Customer cancels</text>
<text x="150" y="1144" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">While Pending</text>
<text x="150" y="1160.9" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">or Preparing</text>
<rect x="312" y="1088" width="236" height="96" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
<text x="430" y="1124" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Manager rejects</text>
<text x="430" y="1144" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Only while the order</text>
<text x="430" y="1160.9" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">is Pending</text>
<rect x="592" y="1088" width="236" height="96" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="710" y="1115.5" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Rider releases the trip</text>
<text x="710" y="1135.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Gives a reason. Open to other riders.</text>
<text x="710" y="1152.4" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">After pickup the order returns</text>
<text x="710" y="1169.3" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">to Ready</text>
<rect x="886" y="1121" width="168" height="30" rx="15" fill="#b91c1c"/>
<text x="970" y="1141" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">Cancelled</text>
<path d="M210 1184V1196H970V1153" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-b91c1c)"/>
<path d="M490 1184V1196" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="10" y="1230" width="1080" height="78" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="550" y="1257" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Administrator can step in</text>
<text x="550" y="1277" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Mark an order Preparing or Ready  ·  Cancel any unfinished order  ·  Assign or change the rider before pickup</text>
<text x="550" y="1293.9" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Only the rider can confirm pickup and delivery</text>
<rect x="10" y="1322" width="1080" height="50" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="550" y="1352" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Live for the manager: a new order counts in the 7-day trend and Trending today at once; cancelled orders do not count</text>
</svg>
